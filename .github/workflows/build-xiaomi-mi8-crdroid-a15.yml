name: Build Xiaomi Mi8 (crDroid A15) (Kernel 4.9)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "xiaomi_mi8"
  DEVICE_CODENAME : "dipper"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LD=ld.lld"

  KERNEL_SOURCE : "https://github.com/polarisxb/android_kernel_xiaomi_sdm845.git"
  KERNEL_BRANCH : "15.0"

  CLANG_SOURCE : "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git"
  CLANG_BRANCH : "lineage-20.0"

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "vendor/xiaomi/mi845_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  # ===== SukiSU 配置 (使用修改后的 Fork) =====
  KERNELSU_SOURCE : "https://github.com/polarisxb/SukiSU-Ultra.git"
  KERNELSU_BRANCH : "builtin"

  KERNELSU_AUTO_GET : "false"
  KERNELSU_AUTO_FORK : ""

  # ===== SUSFS 配置 (关闭) =====
  SUSFS_ENABLE : false
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "crdroid_a15"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"

  KERNELSU_METHOD: "manual"

  # ===== 自定义补丁配置 (本地 NonGKI 仓库内) =====
  PATCHES_SOURCE: ""
  PATCHES_BRANCH: ""

  SUSFS_FOLDER_FIXED: "mi8_dipper"
  SUSFS_PATCH_FIXED: "01_exec_hook,02_open_hook,04_stat_hook,05_input_hook"

  REKERNEL_ENABLE: "false"

  HOOK_METHOD: "syscall"
  HOOK_OLDER: "false"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  HIDE_STUFF: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "true"
  MERGE_CONFIG_FILES: "vendor/xiaomi/dipper.config"

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi Mi8 (crDroid A15) (Kernel 4.9)
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🛠️ Apply Core Hooks (Manual)
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "Applying Core Hooks..."
          # Define 8 core patches (6 hooks + 2 SELinux backport)
          PATCHES=("01_exec_hook.patch" "02_open_hook.patch" "04_stat_hook.patch" "05_input_hook.patch" "06_reboot_hook.patch" "07_selinux_backport.patch" "08_selinux_hooks.patch")
          
          for patch in "${PATCHES[@]}"; do
             # Move patches to kernel root
             # NOTE: build-env moves Patches to /tmp/Patches, so we must copy from there!
             if [ -f "/tmp/Patches/mi8_dipper/$patch" ]; then
                 cp "/tmp/Patches/mi8_dipper/$patch" .
             elif [ -f "$GITHUB_WORKSPACE/Patches/mi8_dipper/$patch" ]; then
                 cp "$GITHUB_WORKSPACE/Patches/mi8_dipper/$patch" .
             else
                 echo "❌ Patch $patch not found in /tmp/Patches or Workspace!"
                 exit 1
             fi

             echo "Applying $patch..."
             patch -p1 < $patch || exit 1
          done
          echo "✅ Hooks applied!"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
